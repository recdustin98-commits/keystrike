<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Keystrike keyboard test</title>
<style>body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#070b1f;color:#e9f1ff;padding:14px}
button{font:600 17px system-ui;padding:12px 16px;border-radius:12px;border:0;background:#7fe0ff;color:#041018;margin:4px 4px 10px 0}
#log{white-space:pre-wrap;font:13px/1.35 ui-monospace,monospace;background:#02040c;border-radius:10px;padding:10px;max-height:52vh;overflow:auto}
#ki{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;font-size:16px;border:0;padding:0}
#info{color:#93a6c9;font-size:13px}</style></head><body>
<h2 style="margin:0 0 8px">Keyboard test</h2>
<p>Tap <b>Start</b>, type <b>palm</b>, then take a screenshot of this page.</p>
<button id="go">Start</button><button id="tapzone" style="background:#f2c14e">Tap here too</button>
<div id="info"></div>
<input id="ki" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done">
<div id="log"></div>
<script>
const ki=document.getElementById('ki'),log=document.getElementById('log');
const L=t=>{log.textContent=(new Date().toISOString().slice(17,23)+' '+t+'\n')+log.textContent};
document.getElementById('info').textContent=navigator.userAgent;
document.getElementById('go').onclick=()=>{ki.value='';ki.focus();L('focus requested -> active: '+(document.activeElement.id||document.activeElement.tagName))};
document.getElementById('tapzone').addEventListener('pointerdown',e=>{e.preventDefault();ki.focus();L('tapzone -> active: '+(document.activeElement.id||document.activeElement.tagName))});
['focus','blur','compositionstart','compositionupdate','compositionend'].forEach(t=>ki.addEventListener(t,e=>L(t+(e.data!=null?' data="'+e.data+'"':''))));
ki.addEventListener('keydown',e=>L('keydown key="'+e.key+'" code='+e.keyCode));
ki.addEventListener('beforeinput',e=>L('beforeinput '+e.inputType+' data="'+e.data+'"'));
ki.addEventListener('input',e=>L('input '+e.inputType+' value="'+ki.value+'"'));
</script></body></html>
