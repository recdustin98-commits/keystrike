<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<title>Keystrike</title>
<meta name="description" content="Keystrike: fly through an asteroid field by typing. Play solo, take the daily challenge, fly as co-pilots, or race a friend 1 vs 1.">
<meta name="theme-color" content="#6a45c4">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Mochiy+Pop+One&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Game view"></canvas>
    <header id="hud">
      <div id="hudMain"></div>
      <button id="pauseBtn" class="icon" aria-label="Pause or leave">II</button>
    </header>
    <div id="msg" aria-live="polite"></div>
    <div id="tap" hidden>Tap to type</div>
    <div id="tip" hidden aria-live="polite"></div>

    <section id="menu" class="screen">
      <div class="panel">
        <h1 class="logo">KEY<span>STRIKE</span></h1>
        <p class="tag">Type to fly! Zap the grumpy rocks, grab the golden gems for bonus.</p>
        <div class="field"><label for="nameIn">Your pilot name <small style="opacity:.7">(tap to change)</small></label><div class="row"><input id="nameIn" maxlength="12" autocomplete="nickname" autocapitalize="words" placeholder="Pilot name"><button id="nameDice" class="btn small" type="button" aria-label="Random name" title="Random name">🎲</button></div></div>
        <p id="nameErr" class="err" role="alert"></p>
        <div id="lvSeg" class="seg" role="group" aria-label="Level"><button id="lvB">Beginner</button><button id="lvX">Expert</button></div>
        <p id="lvHint" class="sub"></p>
        <button id="soloBtn" class="btn primary">Solo flight</button>
        <button id="dailyBtn" class="btn">Daily challenge</button>
        <button id="onlineBtn" class="btn gold">Play with friends</button>
        <button id="installBtn" class="btn" hidden>Download app</button>
        <p id="bestLine" class="sub"></p>
        <div class="mini"><button id="lbBtn" class="btn small">Scores</button><button id="kbBtn" class="btn small"></button><button id="sndBtn" class="btn small"></button></div>
        <p class="sub" style="font-size:12px;opacity:.7">Version 2.1 · <a href="privacy.html" target="_blank" rel="noopener" style="color:inherit">Terms &amp; Privacy</a></p>
      </div>
    </section>

    <section id="online" class="screen" hidden>
      <div class="panel">
        <h2>Play with friends</h2>
        <p class="sub">Create a game and share the 4-letter code, or type a code to join.</p>
        <button id="createBtn" class="btn primary">Create a game</button>
        <div class="or"><span>or join</span></div>
        <input id="codeIn" class="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Game code">
        <button id="joinBtn" class="btn gold">Join</button>
        <p id="netErr" class="err" role="status"></p>
        <button id="backBtn" class="btn small">Back</button>
      </div>
    </section>

    <section id="lobby" class="screen" hidden>
      <div class="panel">
        <p class="sub">Game code</p>
        <div id="lobbyCode" class="bigcode"></div>
        <button id="shareBtn" class="btn small">Share invite</button>
        <div class="seg" role="group" aria-label="Mode"><button id="modeCo">Co-pilot</button><button id="modeRace">1v1 race</button></div>
        <p id="modeHint" class="sub"></p>
        <ul id="players"></ul>
        <button id="readyBtn" class="btn primary">I'm ready</button>
        <button id="startBtn" class="btn gold">Start</button>
        <p id="waitHint" class="sub"></p>
        <button id="leaveLobby" class="btn small">Leave</button>
      </div>
    </section>
  </div>
  <div id="gk" hidden aria-label="Game keyboard"></div>
  <div id="kbspace" aria-hidden="true"></div>
  <input id="ki" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Type here">
  <div id="modal" hidden><div id="card" class="panel"></div></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
